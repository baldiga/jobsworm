name: Scrape supplementary sources

# The ATS feeds refresh from Vercel Cron. These sources cannot: the scraping
# stack is Python, and a Facebook fetch through the residential rung takes far
# longer than a serverless function may run. GitHub Actions is the scheduler.
#
# The metered sources (Apify Facebook groups, LinkedIn) are NOT here. They live
# in social.yml on their own two-day schedule, sharing this workflow's
# concurrency group so the two can never write at once. Splitting them is what
# lets this pass run twice a day without paying Apify twice a day.
#
# Required repository secrets:
#   NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
#   FLOPPYDATA_API_KEY   - only needed for the Facebook rung
#   BRAVE_SEARCH_API_KEY - permalink discovery; without it DuckDuckGo throttles
#   POSTER_HASH_SALT     - refuses to run without it, by design
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID - failure alerts. Optional; the alert
#                          step skips silently when they are unset.

# The live service was retired in October 2026, so this ships with its
# `schedule:` trigger removed and `workflow_dispatch` only. Nothing fires in a
# clone. The cadence it ran on is recorded below; put the `schedule:` block back
# once your own secrets are in place.
#
# It ran on: cron "17 5,17 * * *"
# Twice a day, not four times.
#
# This used to run every 6 hours and re-imported the entire index each
# time, because save_page refreshes fetched_at on every scrape so the
# importer's window matched every row. That rewrote ~4,800 unchanged jobs
# four times a day and took the site down twice on 2026-09-09. The
# content_hash check in import-scraped.ts fixes the rewrite; the cadence
# above fixes the cost.
#
# A full pass took up to 32 minutes. Four passes a day was ~3,800 Actions
# minutes a month, past the 2,000 a private repository gets free; two is
# ~1,200. The database load halves too.
#
# 05:17 and 17:17 UTC sit outside the 00:00-04:00 window the database crons
# own, so a bulk import never lands on top of the nightly hygiene run.
on:
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma-separated: drushimavodot, workable, revhub, facebook"
        default: "drushimavodot,workable,revhub,facebook"

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Scheduled runs belong to the original deployment. A fork that enables
    # Actions would otherwise start scraping on a timer with nothing
    # configured; manual runs (workflow_dispatch) still work anywhere.
    if: github.event_name != 'schedule' || github.repository_owner == 'baldiga'
    # Down from 45. The observed full pass was 32 minutes with the metered
    # sources in it; without them it is well under 20. A hung fetch should cost
    # 25 minutes, not 45, twice a day.
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FLOPPYDATA_API_KEY: ${{ secrets.FLOPPYDATA_API_KEY }}
      POSTER_HASH_SALT: ${{ secrets.POSTER_HASH_SALT }}
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SOURCES: ${{ github.event.inputs.sources || 'drushimavodot,workable,revhub,facebook' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install worker
        working-directory: apps/worker
        run: pip install -r requirements.txt

      # A documented partner feed: free, structured JSON, no scraping. Runs on
      # every free pass because it costs nothing but one HTTP call per 500 jobs.
      - name: Drushim-Avodot partner feed
        if: contains(env.SOURCES, 'drushimavodot')
        working-directory: apps/worker
        continue-on-error: true
        run: python -m jobswarm_scrape.cli drushimavodot

      # Workable's own board, covering every Workable customer hiring in Israel.
      # Free, and its robots.txt grants search indexing outright. ~48 small JSON
      # calls with a 0.4s pause, so about half a minute.
      - name: Workable board
        if: contains(env.SOURCES, 'workable')
        working-directory: apps/worker
        continue-on-error: true
        run: python -m jobswarm_scrape.cli workable

      # A hand-curated go-to-market feed: one static JSON file, thirty-odd
      # roles, and the only real coverage the index has of the commercial side
      # of a tech company. Regenerated by hand, so most passes import nothing —
      # that is the 30-day cap working, not the adapter failing.
      - name: RevHub GTM feed
        if: contains(env.SOURCES, 'revhub')
        working-directory: apps/worker
        continue-on-error: true
        run: python -m jobswarm_scrape.cli revhub

      # The feed pass tops up the groups we track; the permalink pass is where
      # the volume is, once a search key exists. Both are free — the metered
      # Apify reader lives in social.yml.
      #
      # Public groups only, and at your own risk: see "Data sources and the
      # law" in the README before you run these for your own deployment.
      - name: Scrape approved Facebook groups
        if: contains(env.SOURCES, 'facebook') && env.FLOPPYDATA_API_KEY != ''
        working-directory: apps/worker
        continue-on-error: true
        run: python -m jobswarm_scrape.cli fb-scrape --limit 30

      - name: Harvest Facebook post permalinks
        if: contains(env.SOURCES, 'facebook') && env.BRAVE_SEARCH_API_KEY != ''
        working-directory: apps/worker
        continue-on-error: true
        run: python -m jobswarm_scrape.cli fb-posts --limit 60

      # Close listings whose source page says the job is gone.
      #
      # Costs nothing but HTTP requests. 500 per run sweeps the whole index
      # roughly every four days at two passes a day. It is deliberately
      # conservative: a timeout or a bot wall is not evidence a job is dead, so
      # ambiguous results are left open and re-checked next time.
      - name: Close dead listings
        working-directory: apps/worker
        continue-on-error: true
        run: python -m jobswarm_scrape.cli linkcheck --limit 500

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `--sources` matters: without it a run triggered for ONE source still
      # re-imported every source, which is how a targeted 10-group check turned
      # into a 22-minute rewrite of the whole index.
      #
      # `--fail-on-empty` is what makes a dead pipeline visible. Every scraper
      # step above is `continue-on-error`, deliberately — one throttled source
      # should not lose the rest of the pass — but that also means all of them
      # can fail and the workflow still finishes green. This exits 2 when NO
      # source produced a single candidate, which is the only shape of failure
      # that means "nothing is being collected at all".
      - name: Decompose and import
        run: pnpm import:scraped --sources="$SOURCES" --fail-on-empty

      # The failure that actually happened was silent: runs died at minute 2
      # for a week and looked exactly like runs that never started. A red tick
      # on a page nobody opens is not monitoring.
      #
      # `if: failure()` rather than `always()`, so a green pass stays quiet.
      # `curl -f` is deliberate: if Telegram rejects the message this step goes
      # red too, rather than reporting a delivery that never happened.
      - name: Tell Telegram it failed
        if: failure() && env.TELEGRAM_BOT_TOKEN != ''
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -fsS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=Jobsworm: the scrape pass failed. ${RUN_URL}"
